name: youjulab

# 服务器精简栈：Postgres + mcp-server + Ollama + nginx（HTTP / IP）。
# 证书相关脚本见 deploy/certbot/（当前默认仅 HTTP）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-youju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youju-dev-change-me}
      POSTGRES_DB: finresearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb.sh:/docker-entrypoint-initdb.d/01-office-vectors.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # 不对外暴露；拉模型：docker compose exec ollama ollama pull bge-m3
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      FINANCE_MCP_TRANSPORT: http
      FINANCE_MCP_HOST: 0.0.0.0
      FINANCE_MCP_PORT: "8000"
      FINANCE_DATABASE_URL: postgresql://${POSTGRES_USER:-youju}:${POSTGRES_PASSWORD:-youju-dev-change-me}@postgres:5432/finresearch
      FINANCE_DB_HOST: postgres
      FINANCE_DB_PORT: "5432"
      FINANCE_DB_USER: ${POSTGRES_USER:-youju}
      FINANCE_DB_PASSWORD: ${POSTGRES_PASSWORD:-youju-dev-change-me}
      FINANCE_DB_NAME: finresearch
      FINANCE_DB_ADMIN: postgres
      OFFICE_PG_URL: postgresql://${POSTGRES_USER:-youju}:${POSTGRES_PASSWORD:-youju-dev-change-me}@postgres:5432/office_vectors
      FINANCE_PDF_ROOT: /app/data
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:-invpdevstatic32tokenpleasechange}
      ACCOUNT_JWT_SECRET: ${ACCOUNT_JWT_SECRET:-account-dev-secret-please-change}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    volumes:
      - mcp_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/mcp.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  mcp_data:
  ollama_data:
