<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>有据 · 软件更新</title><link rel="stylesheet" href="style.css"><script src="renderer.js" defer></script></head>
<body><header><img src="../build/icon.png" alt="有据"><strong>有据 youjulab</strong><span>软件更新</span></header>
<main><div class="version-row"><h1 id="heading">正在检查更新</h1><span id="mandatory" hidden>需要更新</span></div>
<p id="version"></p><p id="message" role="status">正在连接版本服务…</p><section id="details" hidden><h2>更新内容</h2><div id="notes"></div></section>
<div id="download" hidden><div class="progress-label"><span id="phase">正在下载</span><strong id="percent">0%</strong></div><progress id="progress" value="0" max="100"></progress></div>
<p id="error" role="alert" hidden></p><p id="manual" hidden>macOS 需要手动安装。请退出旧版，将安装包中的有据拖入“应用程序”替换，再启动新版本。</p>
<footer><button id="quit" data-action="quit">退出应用</button><span></span><button id="retry" data-action="retry" hidden>重新检查</button><button id="skip" data-action="skip" hidden>暂不更新</button><button id="cancel" data-action="cancel" hidden>取消下载</button><button id="open" data-action="open" hidden>打开安装包</button><button id="update" data-action="download" class="primary" hidden>立即更新</button></footer></main></body></html>
